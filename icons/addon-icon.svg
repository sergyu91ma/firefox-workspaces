<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0060df"/>
      <stop offset="1" stop-color="#003eaa"/>
    </linearGradient>
  </defs>

  <!-- Tile (Primary Blue) -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#tile)"/>

  <!-- Back window: another workspace -->
  <rect x="26" y="28" width="58" height="46" rx="9" fill="none" stroke="#fafafa" stroke-opacity="0.55" stroke-width="6"/>

  <!-- Front window: active workspace -->
  <rect x="44" y="48" width="58" height="48" rx="9" fill="#fafafa"/>
  <rect x="44" y="64" width="58" height="3" fill="#0060df" fill-opacity="0.18"/>

  <!-- Workspace color dots -->
  <circle cx="55" cy="56.5" r="3.6" fill="#ff4f5e"/>
  <circle cx="66" cy="56.5" r="3.6" fill="#ffa436"/>
  <circle cx="77" cy="56.5" r="3.6" fill="#00d230"/>
</svg>
